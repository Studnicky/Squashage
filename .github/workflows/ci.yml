name: ci

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest]
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@studnicky'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Verify dist artifacts
        shell: bash
        run: |
          test -f dist/cli/dagonizerCli.js
          test -f dist/SquashageRun.js
          test -f dist/dag/squashage-run.dag.jsonld
          test -f dist/output/FileOutput.js

      - name: Audit production deps
        run: npm audit --omit=dev --audit-level=high
