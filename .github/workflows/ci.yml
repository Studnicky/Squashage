name: ci

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:   [ubuntu-latest, macos-latest]
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Verify dist artifacts
        shell: bash
        run: |
          test -f dist/cli/cli.js
          test -f dist/pipeline/Pipeline.js
          test -f dist/orchestrators/SquashageOrchestrator.js
          test -f dist/output/FileOutput.js
          test -f dist/classification/ClassificationFactory.js

      - name: Audit production deps
        run: npm audit --omit=dev --audit-level=high
