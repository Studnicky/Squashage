name: License Check

on:
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  license-check:
    name: Validate Dependency Licenses
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: '24'

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Check dependency licenses
        id: license-check
        run: |
          npx license-checker \
            --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.1;LGPL-3.0;UNLICENSED" \
            --summary 2>&1 | tee license-report.txt

      - name: Comment on PR (if violations found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('license-report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## License Compliance Issue\n\nSome dependencies have unapproved licenses:\n\n\`\`\`\n${report}\n\`\`\`\n\nReview the dependency or find an alternative package.`
            });

    timeout-minutes: 15
